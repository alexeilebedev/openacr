<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Websocket Demo</title>
  </head>
  <body>
    <div id="log"></div>
    <script defer type="module">
      // https://github.com/nats-io/nats.ws
      import { connect, StringCodec } from "https://cdn.jsdelivr.net/npm/nats.ws@1.10.0/esm/nats.js";

      // Append TEXT to the page as one line.  A document.write here would run
      // after the page loaded, which replaces the document and closes the
      // connection with it.
      function log(text) {
        const div = document.createElement("div");
        div.textContent = text;
        document.getElementById("log").append(div);
      }

      // The gateway serves no pages, so open this file from the checkout and
      // name the gateway's HTTP port as ?ws=<host>:<port>.
      const ws = new URLSearchParams(location.search).get("ws");
      if (!ws) {
        log("open this page with ?ws=<host>:<httpport>");
        throw new Error("no ?ws= parameter");
      }
      const nc = await connect({ servers: ["ws://" + ws + "/"] });

      // create a codec
      const sc = StringCodec();
      // create a simple subscriber and iterate over messages
      // matching the subscription
      const subject = "public.anon";
      const sub = nc.subscribe(subject);
      log(`publish some messages to ${subject}, they will appear here`);

      (async () => {
        for await (const m of sub) {
          log(`[${sub.getProcessed()}]: ${sc.decode(m.data)}`);
        }
        log("subscription closed");
      })();

      nc.publish(subject, sc.encode("Hello"));
      nc.publish(subject, sc.encode("World!"));
    </script>
  </body>
</html>
