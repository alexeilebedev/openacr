<!DOCTYPE html>
<!--
  The page doc fills in.  Every name in double braces below is replaced once, by
  name, in one pass: the title names the location, style is the stylesheet -- inlined
  by a server so that a page saved to disk still carries its own, and linked by a site
  where the sheet is a file beside the pages -- script is the page's script, which a
  server inlines and a site links by that same rule,
  home is the documentation index, helpbtn is the button leading to this tool's own manual
  and is nothing on a site, help is that manual's address, action is
  the URL prefix the box submits to, site is an attribute marking the form on a site
  and nothing on a server, query is the canonical text of the page, shown is that same text with its
  words linked, nav is the navigation pane -- element and all, since a page with
  nothing to put in it carries none -- body is the location itself, and the two
  footer names are the day of the commit the running binary was built from, that
  commit's id, and the year that day falls in.  A name doc does not know is left as it stands.

  Nothing outside those braces is touched, and this comment names none of them
  outright -- a comment that spelled a placeholder would have that placeholder
  filled in, and the page would open with its own stylesheet quoted at the top.

  The box has two faces in one slot, because an input cannot hold links and a line
  of links cannot be typed into.  The input is what a browser without javascript
  shows, and it works: it is a real form and Enter submits it.  The linked line is
  the enhancement, revealed by the script at the foot, and clicking anywhere in it
  that is not a link selects the location for editing.  The script also appends the
  fragment, which is the one part of the state that never reaches the server.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{title}}</title>
{{style}}
<script>
/*
  A reader's choice of light or dark is theirs, so it is read back before the page paints
  rather than after: a class applied from the foot of the document repaints a page the
  reader has already seen open in the other one.  A page whose stylesheet answers to
  neither -- the one a server draws -- is unaffected either way.
*/
try { document.documentElement.dataset.theme = localStorage.getItem('doc-theme') || ''; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <a class="home" href="{{home}}">doc</a>
  {{helpbtn}}
  <button class="theme" type="button" title="light or dark">&#9680;</button>
  <form class="find" action="{{action}}" method="get"{{site}}>
    <div class="shown" title="click to edit, or / from anywhere">{{shown}}</div>
    <input class="text" type="text" name="q" value="{{query}}" placeholder="a key, or a table:record" autocomplete="off" spellcheck="false"/>
  </form>
</header>
<div class="frame">
{{nav}}
<main class="page">
{{body}}
</main>
</div>
<footer class="foot">
  <div class="about">
    <div class="line">
      <span class="copy">Copyright &copy; {{year}}, AlgoX2</span>
      <span class="made">Made with <a href="{{help}}">doc</a></span>
    </div>
    <div class="line">
      <span class="when">Last updated on {{commit}}</span>
    </div>
  </div>
  <span class="ref">commit:{{gitref}}</span>
</footer>
{{script}}
</body>
</html>
